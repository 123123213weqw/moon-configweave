# Application defaults shared by every environment.

[service]
name = "orders"
port = 8080
workers = 2
log_level = "info"
features = ["metrics"]

[database]
host = "localhost"
port = 5432
name = "orders"
user = "orders"
password = "${env:ORDERS_DB_PASSWORD}"
url = "postgres://${config:/database/user}@${config:/database/host}:${config:/database/port}/${config:/database/name}"

[cache]
enabled = false
ttl_seconds = 60
